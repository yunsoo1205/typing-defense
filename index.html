<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>필답·면접 준비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --ink:#17202D; --muted:#5A6573; --line:#CFD8D6;
  --staff:#B9C4C2; --cobalt:#2A52CC; --cobalt-soft:#DCE4FA; --ochre:#A97A1F; --ochre-soft:#F5EAD3;
  --green:#2A7F60; --green-soft:#DCEFE6; --red:#B23A33; --red-soft:#F6DEDC;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141A22; --surface:#1C2430; --ink:#E7ECEF; --muted:#9BA6B3; --line:#2E3946;
    --staff:#3A4756; --cobalt:#7C9BFF; --cobalt-soft:#24304F; --ochre:#E0B25A; --ochre-soft:#3A3020;
    --green:#5FC59C; --green-soft:#1D3A30; --red:#F08A82; --red-soft:#3F2523;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.3}
h2{font-size:1.15rem}
p{margin:.4em 0}
.muted{color:var(--muted);font-size:.85rem}
.hint{color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);font-size:.9rem;margin:.6em 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.countdown{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dnum{font-family:var(--serif);font-size:2.6rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.dsub{color:var(--muted)}
.meta{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:.9rem}

/* staff timeline: one bar per day on five staff lines */
.staff{display:flex;gap:4px;margin:14px 0 6px;padding:10px 6px 6px;overflow-x:auto;
  background:
    repeating-linear-gradient(to bottom,transparent 0,transparent 11px,var(--staff) 11px,var(--staff) 12px) 0 10px/100% 60px no-repeat,
    var(--surface);
  border:1px solid var(--line);border-radius:6px}
.bar{flex:1 0 26px;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:0;cursor:pointer}
.bar-col{position:relative;width:100%;height:60px;border-radius:3px;overflow:hidden;background:transparent;border:1px solid transparent}
.bar-fill{position:absolute;left:0;right:0;bottom:0;background:var(--ink);opacity:.85}
.bar-d{font-size:.8rem;font-weight:600;line-height:1.1}
.bar-w{font-size:.7rem;color:var(--muted);line-height:1}
.t-full .bar-col{background:color-mix(in srgb,var(--cobalt-soft) 70%,transparent)}
.t-trip .bar-col{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 25%,transparent) 4px 5px)}
.t-exam .bar-col{background:var(--ink)}
.t-exam .bar-d{color:var(--red)}
.bar.is-today .bar-col{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt)}
.bar.is-today .bar-d{color:var(--cobalt)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 16px;overflow-x:auto;position:sticky;top:0;background:var(--paper);z-index:5;padding-top:env(safe-area-inset-top,0)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ochre-soft);color:var(--ochre);font-size:.75rem;line-height:18px;text-align:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.panel.is-today{border-left:4px solid var(--cobalt)}
.panel.past{opacity:.72}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lv,.kind,.tag,.ded{white-space:nowrap}
.tag{font-size:.75rem;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.tag.t-full{background:var(--cobalt-soft);border-color:transparent;color:var(--cobalt)}
.tag.t-exam{background:var(--ink);color:var(--surface);border-color:transparent}
.tag.t-trip{background:var(--paper)}

/* tasks */
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{padding-top:2px}
.chk input{width:20px;height:20px;accent-color:var(--green);cursor:pointer}
.tbody{flex:1;min-width:0}
.tline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.slot{font-size:.75rem;color:var(--muted)}
.kind{font-size:.72rem;padding:0 7px;border-radius:9px;background:var(--paper);color:var(--muted)}
.k-exam{background:var(--cobalt-soft);color:var(--cobalt)}
.k-iv{background:var(--green-soft);color:var(--green)}
.k-en{background:var(--ochre-soft);color:var(--ochre)}
.k-spare{background:var(--paper);color:var(--muted)}
ol.spare{list-style:none;margin:0;padding:0;counter-reset:sp}
.spare li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.spare li:first-child{border-top:0}
.spare .num{font-family:var(--serif);font-weight:700;min-width:1.6em;color:var(--muted);padding-top:1px}
.spare li.done .stitle{text-decoration:line-through;color:var(--muted)}
.spare .stitle{flex:1;min-width:0}
.viewer{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.viewer iframe{display:block;width:100%;height:78vh;border:0;background:#fff}
.jumps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.jumps button{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.doclist{list-style:none;margin:0;padding:0}
.tpl h3{font-size:1rem;margin:16px 0 6px}
.tpl .quote{background:var(--paper);padding:8px 12px;border-radius:0 6px 6px 0}
.score{font-family:var(--serif);font-size:2.8rem;font-weight:700;line-height:1}
.score small{font-size:1rem;color:var(--muted);font-weight:400;margin-left:4px}
.good{background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.good p{margin:.3em 0}
.err{color:var(--red);font-weight:500}
mark.chk{background:#FFE58A;color:#3A2E00;padding:0 3px;border-radius:3px}
.met{font-size:.75rem;padding:1px 8px;border-radius:10px;white-space:nowrap}
.met.y{background:var(--green-soft);color:var(--green)} .met.n{background:var(--red-soft);color:var(--red)}
.quote{border-left:3px solid var(--cobalt);padding-left:10px}
.hist{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;cursor:pointer;display:flex;gap:10px;align-items:baseline;color:var(--ink)}
.hist:first-child{border-top:0}
.hist .qline{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doclist li{padding:10px 0;border-top:1px solid var(--line)}
.doclist li:first-child{border-top:0}
.ttitle{margin-top:2px}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tnote{font-size:.85rem;color:var(--muted);white-space:pre-wrap;border-left:2px solid var(--line);padding-left:8px;margin-top:4px}
.tacts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.dpick{font-size:.8rem;padding:2px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}

/* controls */
.btn{background:var(--ink);color:var(--surface);border:1px solid var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.go{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.link{background:none;border:0;padding:0;color:var(--cobalt);cursor:pointer;font-size:.85rem}
.link.danger{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--muted)}
.field input,.field select,.field textarea,.inline input,.inline select{
  border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--surface);color:var(--ink);font-size:.95rem;width:100%}
.field textarea{resize:vertical}
.inline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inline select{width:auto}
.inline input{flex:1;min-width:160px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:.85rem;color:var(--ink);cursor:pointer}
.checks input{accent-color:var(--red)}
details>summary{cursor:pointer;color:var(--muted);font-size:.9rem}
details.addday{margin-top:6px}
ul.plain{margin:.4em 0;padding-left:1.2em}

/* today */
.due-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.due{display:flex;align-items:baseline;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;text-align:left}
.due b{font-family:var(--serif);font-size:1.8rem;line-height:1}

/* answers */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;background:var(--paper);border-radius:6px;margin-bottom:12px}
.clock{font-family:var(--serif);font-size:1.6rem;font-variant-numeric:tabular-nums}
.clock.over{color:var(--red)}
.lv{font-size:.75rem;padding:1px 8px;border-radius:10px}
.lv0{background:var(--red-soft);color:var(--red)}
.lv1{background:var(--ochre-soft);color:var(--ochre)}
.lv2{background:var(--cobalt-soft);color:var(--cobalt)}
.lv3{background:var(--green-soft);color:var(--green)}
.ded{font-size:.75rem;padding:1px 8px;border-radius:10px;border:1px solid var(--red);color:var(--red)}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-child{border-top:0}
.entry summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--ink)}
.entry .body{padding:8px 0 0 2px}
.pre{white-space:pre-wrap;font-size:.92rem}
.lab{font-size:.78rem;color:var(--muted);margin-top:6px}

/* review */
table.axes{width:100%;border-collapse:collapse;font-size:.9rem}
.axes th,.axes td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.axes th{font-weight:500;color:var(--muted);font-size:.8rem;border-top:0}
.axes select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface)}
.tablewrap{overflow-x:auto}
.flash{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--paper)}
.flash .front{font-size:1.1rem;font-family:var(--serif);margin:.4em 0}
.flash .variant{border-left:3px solid var(--ochre);padding-left:10px;color:var(--ink)}
.flash .back{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);white-space:pre-wrap}
.sheet h3{font-size:1rem;margin:14px 0 4px}
.sheet h3:first-child{margin-top:0}

/* interview */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.stage{text-align:center;padding:24px 12px}
.stage .phase{color:var(--muted);font-size:.9rem}
.stage .q{font-family:var(--serif);font-size:1.35rem;max-width:640px;margin:10px auto 6px;line-height:1.45}
.stage .big{font-family:var(--serif);font-size:4rem;font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
.stage.speak .big{color:var(--cobalt)}
.stage.follow .big{color:var(--green)}
.kw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.kw span{font-size:.85rem;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:1px 10px}
.rec-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px}

/* login / misc */
.login{max-width:420px;margin:12vh auto;padding:24px}
.login h1{font-size:1.8rem;margin-bottom:8px}
.fatal,.loading{max-width:560px;margin:20vh auto;padding:20px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:.9rem;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
@media (max-width:560px){
  .dnum{font-size:2.1rem}
  .due-grid{grid-template-columns:1fr}
  .stage .big{font-size:3.2rem}
}
</style>
</head>

const JUMPS = {

const AXES = ["설계모형", "학습이론·구성주의", "매체·테크놀로지", "교육공학 정의", "AI·학습분석"];

class LocalDB {
  constructor(){ this.key = "prep-dashboard-v1"; try { this.d = JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ this.d = {}; } }
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch(e){ toast("브라우저 저장 공간에 쓰지 못했어요"); } }
  async list(t){ return (this.d[t] || []).map(r => ({...r})); }
  async insert(t, row){ const r = {id: uid(), created_at: new Date().toISOString(), ...row}; (this.d[t] = this.d[t] || []).push(r); this.save(); return {...r}; }
  async insertMany(t, rows){ const out = []; for (const r of rows) out.push(await this.insert(t, r)); return out; }
  async update(t, id, patch){ const a = this.d[t] || []; const i = a.findIndex(r => r.id === id); if (i < 0) throw new Error("항목을 찾지 못했어요"); a[i] = {...a[i], ...patch}; this.save(); return {...a[i]}; }
  async remove(t, id){ this.d[t] = (this.d[t] || []).filter(r => r.id !== id); this.save(); }
}
class SupaDB {
  constructor(c){ this.c = c; }
  async list(t){ const {data, error} = await this.c.from(t).select("*").order("created_at"); if (error) throw error; return data; }
  async insert(t, row){ const {data, error} = await this.c.from(t).insert(row).select().single(); if (error) throw error; return data; }
  async insertMany(t, rows){ const {data, error} = await this.c.from(t).insert(rows).select(); if (error) throw error; return data; }
  async update(t, id, patch){ const {data, error} = await this.c.from(t).update(patch).eq("id", id).select().single(); if (error) throw error; return data; }
  async remove(t, id){ const {error} = await this.c.from(t).delete().eq("id", id); if (error) throw error; }
}

async function upd(t, id, patch){ const r = await db.update(t, id, patch); S[t] = S[t].map(x => x.id === id ? r : x); return r; }

function addTaskInline(date){

function viewToday(){
  const t = todayStr(), ty = dayType(t);
  const list = tasksOn(t);
  const overdue = S.tasks.filter(x => x.date && x.date < t && !x.done).sort(cmpTask);
  const due = dueCards(t), rew = rewritesDue(t);
  let h = "";
  if (!S.tasks.some(x => x.kind !== "여유") || !S.interview.length) h += seedPanel();
  h += `<section class="panel"><div class="ph"><h2>${md(t)} ${wd(t)}요일 할 일</h2><span class="tag t-${TYPE_KEY[ty]}">${esc(TYPE_NOTE[ty] || ty)}</span></div>`;
  if (ty === "여행") h += `<p class="hint">여행 중에는 공부 0분이 기본이에요. 여유가 있을 때만 10분 인출이나 영어 말하기를 해요.</p>`;
  h += list.length ? `<ul class="tasks">${list.map(x => taskRow(x)).join("")}</ul>` : `<p class="empty">오늘 배치된 할 일이 없어요. 아래에서 추가하거나 일정 탭의 미배치 과제함에서 가져오세요.</p>`;

  h += `<section class="panel"><div class="ph"><h2>오늘 다시 볼 것</h2></div><div class="due-grid">
      <button class="due" data-act="tab" data-tab="review"><b>${due.length}</b><span>복습 카드</span></button>
      <button class="due" data-act="tab" data-tab="answers"><b>${rew.length}</b><span>다시 쓸 답안</span></button></div>
      ${rew.length ? `<ul class="plain">${rew.map(a => `<li>${esc(a.axis)}: ${esc(a.question)}</li>`).join("")}</ul>` : ""}</section>`;
  if (overdue.length) h += `<section class="panel"><div class="ph"><h2>지난 날짜의 미완료 과제</h2><span class="muted">자동으로 옮기지 않아요. 직접 골라 주세요.</span></div><ul class="tasks">${overdue.map(x => taskRow(x, {overdue: true})).join("")}</ul></section>`;

function seedPanel(){
  return `<section class="panel"><div class="ph"><h2>처음 쓰는 경우</h2></div>

function viewPlan(){
  const t = todayStr();
  const un = S.tasks.filter(x => !x.date && x.kind !== "여유").sort(cmpTask);
  let h = `<section class="panel"><div class="ph"><h2>미배치 과제함</h2><span class="muted">${un.length}개, 날짜를 고르면 그날로 옮겨져요</span></div>
    ${un.length ? `<ul class="tasks">${un.map(x => taskRow(x, {plan: true})).join("")}</ul>` : `<p class="empty">미뤄 둔 과제가 없어요.</p>`}${addTaskInline(null)}</section>`;
  for (const d of dateRange()){
    const ts = tasksOn(d), ty = dayType(d);
    h += `<section class="panel ${d === t ? "is-today" : ""} ${d < t ? "past" : ""}" id="day-${d}">
      <div class="ph"><h2>${md(d)} ${wd(d)}</h2><span class="tag t-${TYPE_KEY[ty]}">${esc(ty)}</span><span class="muted">${ddayLabel(d)}</span></div>
      ${ts.length ? `<ul class="tasks">${ts.map(x => taskRow(x, {plan: true})).join("")}</ul>` : `<p class="empty">할 일 없음</p>`}

  }
  h += viewSpare(true);
  const outside = S.tasks.filter(x => x.date && (x.date < CONFIG.START_DATE || x.date > CONFIG.EXAM_DATE)).sort(cmpTask);
  if (outside.length) h += `<section class="panel"><div class="ph"><h2>기간 밖 날짜</h2></div><ul class="tasks">${outside.map(x => taskRow(x, {plan: true})).join("")}</ul></section>`;
  return h;
}

    <li><b>from/with</b>: learning from은 매체가 제공하는 설명·피드백으로부터 배우는 방식이고, learning with는 도구로 학습자가 자신의 생각을 표현·검토·수정하는 방식이다(Jonassen &amp; Reeves, 1996).</li>
    <li><b>수행과 이해의 구분</b>: 도구와 함께 이룬 과제 수행의 성공과 학습자 개인의 이해는 구분하여 확인해야 한다.</li>
    <li><b>스캐폴딩</b>: 근접발달영역 안에서 일시적 지원을 제공하고, 능력이 향상됨에 따라 점진적으로 제거한다.</li>
    <li><b>메타인지 순환</b>: 목표와 기준을 정하는 계획, 이해와 진행을 확인하는 점검, 결과와 전략을 되돌아보는 평가가 순환한다(Schraw &amp; Moshman, 1995).</li>
    <li><b>과정중심평가</b>: 학습결과에 대한 평가, 학습으로서의 평가, 학습을 위한 평가를 결합한다.</li>
    <li><b>학습자 주도성</b>: AI의 편리함에 사고를 위임하려는 경향에 저항하며, 학습 목표에 맞게 AI를 능동적·비판적으로 활용하는 역량.</li>
    <li><b>체제적 접근</b>: 구성요소들이 상호작용하므로 한 요소(도구)의 변화는 체제 전체의 재설계를 요구한다.</li>
  </ul>
  <h3>6. 쓰지 말아야 할 것</h3>
  <ul class="plain">
    <li><b>이론으로 단정하기</b>: "분산인지에 따르면 지식이 구성되지 않는다"처럼 이론이 말하지 않는 결론을 붙이지 않는다. 인과는 "~할 수 있다" + 조건으로 쓴다.</li>
    <li><b>개념 등치하기</b>: "from = 사고 대행"처럼 다른 축의 개념을 같다고 쓰지 않는다.</li>
    <li><b>금지어</b>: ZPD에 '갭', 루브릭에 '기능·조건', 인지주의에 '동화·조절'.</li>
  </ul></div>`;
}

async function docUrl(id, anchor){
  const m = MATERIALS.find(d => d.id === id); if (!m) throw new Error("자료를 찾지 못했어요");
  let url = m.path;
  if (m.storage && sb){
    const {data, error} = await sb.storage.from(CONFIG.STORAGE_BUCKET).createSignedUrl(m.storage, 60 * 60);
    if (error) throw new Error(`Storage에서 ${m.storage}를 열지 못했어요 (${error.message})`);
    url = data.signedUrl;
  }
  return url + (anchor || "");
}

const DQ = () => (ui.daily = ui.daily || {loaded: false, loading: false, q: null, attempts: [], history: [], view: null, answer: "", start: null, saving: "", grading: false, error: ""});
const A_ = v => (Array.isArray(v) ? v : []);
const hl = t => esc(t).replace(/\[확인필요\]/g, '<mark class="chk">[확인필요]</mark>');
const hm = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
async function fnCall(name, body){
  const {data, error} = await sb.functions.invoke(name, {body});
  if (error){ let msg = error.message; try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch(e){} throw new Error(msg); }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function dailyRefresh(){
  const d = DQ();
  if (d.q){ const a = await sb.from("exam_attempts").select("*").eq("question_id", d.q.id).order("created_at", {ascending: false}); if (a.error) throw a.error; d.attempts = a.data || []; }
  const h = await sb.from("exam_questions").select("id,date,question,type,axis,exam_attempts(score,created_at)").order("date", {ascending: false}).limit(30);
  if (h.error) throw h.error; d.history = h.data || [];
}
async function dailyLoad(){
  const d = DQ(); if (!sb || d.loading) return;
  d.loading = true; d.error = ""; render();
  try {
    const r = await fnCall("generate-question", {});
    d.q = r.question; d.answer = d.q.draft || ""; d.start = Date.now();
    await dailyRefresh(); d.loaded = true;
  } catch(e){ d.error = e.message || String(e); }
  d.loading = false; if (ui.tab === "daily") render();
}

/* ---------- 답안 ---------- */
function timerSec(){ const tm = ui.timer; return Math.floor((tm.acc + (tm.start ? Date.now() - tm.start : 0)) / 1000); }
function updateTimerEl(){ const el = document.getElementById("a-clock"); if (!el) return; const s = timerSec(); el.textContent = clock(s); el.classList.toggle("over", s > CONFIG.EXAM_MINUTES * 60); const b = document.getElementById("a-tbtn"); if (b) b.textContent = ui.timer.start ? "정지" : (s ? "이어서 시작" : "시작"); }

function viewAnswers(){
  const t = todayStr();
  const e = ui.editAnswer ? find("answers", ui.editAnswer) : null;
  const d = ui.answerDraft;
  const v = e || (d ? {date: t, axis: d.axis, question: d.question, minutes: "", level: 1, deductions: [], outline: "", feedback: "", rewrite_date: addDays(t, 3)} : null) || {date: t, axis: AXES[0], question: "", minutes: "", level: 1, deductions: [], outline: "", feedback: "", rewrite_date: addDays(t, 3)};
  let h = tplDetails(false) + `<section class="panel"><div class="ph"><h2>${e ? "답안 기록 수정" : "답안 기록"}</h2><span class="muted">점수보다 감점 원인과 다시 쓸 날을 남겨요</span></div>
    <div class="timer"><span class="clock" id="a-clock">0:00</span><span class="muted">목표 ${CONFIG.EXAM_MINUTES}분</span>
      <button class="btn sm go" id="a-tbtn" data-act="timer-toggle">시작</button><button class="btn sm ghost" data-act="timer-reset">초기화</button></div>
    <div class="grid">
      <label class="field">날짜<input type="date" id="a-date" value="${esc(v.date)}"></label>
      <label class="field">축<select id="a-axis">${axisOpts(v.axis)}</select></label>
      <label class="field">걸린 시간(분)<input type="number" min="0" id="a-min" value="${esc(v.minutes ?? "")}"></label>
      <label class="field">도달 단계<select id="a-level">${LEVELS.map((l, i) => `<option value="${i}" ${+v.level === i ? "selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>
    <label class="field" style="margin-top:10px">문제<input id="a-q" value="${esc(v.question)}" placeholder="예: 딕과 케리 모형의 장점과 제한점, 개선 방향"></label>
    <div class="lab">감점 원인</div>
    <div class="checks">${DEDUCTIONS.map(d => `<label><input type="checkbox" class="a-ded" value="${esc(d)}" ${(v.deductions || []).includes(d) ? "checked" : ""}>${esc(d)}</label>`).join("")}</div>
    <div class="grid" style="margin-top:10px;grid-template-columns:1fr">
      <label class="field">개요<textarea id="a-outline" rows="4">${esc(v.outline)}</textarea></label>
      <label class="field">자기채점 피드백 (빠진 키워드, 고칠 논리)<textarea id="a-fb" rows="3">${esc(v.feedback)}</textarea></label>
    </div>
    <div class="row"><label class="field" style="max-width:200px">다시 쓸 날<input type="date" id="a-rew" value="${esc(v.rewrite_date || "")}"></label></div>
    <div class="row"><button class="btn" data-act="save-answer">${e ? "수정 저장" : "답안 기록 저장"}</button>${e || ui.answerDraft ? `<button class="btn ghost" data-act="cancel-answer">취소</button>` : ""}</div></section>`;
  const list = [...S.answers].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  h += `<section class="panel"><div class="ph"><h2>쓴 답안</h2><span class="muted">${list.length}편</span></div>`;
  h += list.length ? list.map(a => `<details class="entry"><summary><span class="muted">${a.date ? md(a.date) : ""}</span><span class="lv lv${a.level ?? 0}">${LEVELS[a.level ?? 0]}</span><b>${esc(a.axis)}</b><span>${esc(a.question)}</span>${a.rewrite_date && !a.rewrite_done ? `<span class="muted">다시 쓰기 ${md(a.rewrite_date)}</span>` : ""}</summary>
      <div class="body">
        ${a.minutes ? `<div class="muted">${a.minutes}분</div>` : ""}
        ${(a.deductions || []).length ? `<div class="checks" style="margin-top:4px">${a.deductions.map(d => `<span class="ded">${esc(d)}</span>`).join("")}</div>` : ""}
        ${a.outline ? `<div class="lab">개요</div><div class="pre">${esc(a.outline)}</div>` : ""}
        ${a.feedback ? `<div class="lab">피드백</div><div class="pre">${esc(a.feedback)}</div>` : ""}
        <div class="tacts" style="margin-top:8px">
          <button class="link" data-act="edit-answer" data-id="${a.id}">수정</button>
          ${a.rewrite_date && !a.rewrite_done ? `<button class="link" data-act="rewrite-done" data-id="${a.id}">다시 쓰기 완료</button>` : ""}
          <button class="link" data-act="make-card" data-id="${a.id}">오답 카드 만들기</button>
          <button class="link danger" data-act="del-answer" data-id="${a.id}">삭제</button>
        </div></div></details>`).join("") : `<p class="empty">아직 기록이 없어요. 답안을 하나 쓰고 위에 남겨 보세요.</p>`;
  return h + `</section>`;
}

/* ---------- 복습 ---------- */
/* ---------- 오답 카드: 문제를 보고 먼저 생각한 뒤 답안 확인 ---------- */
function prqCards(){ const q = ui.prq; return q ? q.ids.map(id => find("cards", id)).filter(Boolean) : []; }
function viewCards(){
  const t = todayStr(), mode = ui.cardMode || "practice", due = dueCards(t);
  let h = `<section class="panel" id="card-form"><div class="ph"><h2>오답 카드</h2>
    <span class="seg" style="margin-left:auto">${[["practice", `연습하기${due.length ? ` (${due.length})` : ""}`], ["make", "만들기"], ["list", `전체 ${S.cards.length}장`]].map(([k, l]) => `<button aria-pressed="${mode === k}" data-act="card-mode" data-v="${k}">${l}</button>`).join("")}</span></div>`;
  if (mode === "make"){
    const ec = ui.editCard ? find("cards", ui.editCard) : null;
    const v = ec || ui.cardDraft || {axis: AXES[0], front: "", back: "", variant: "", due: t};
    h += `<p class="hint">${ec ? "카드를 고치고 있어요." : "틀린 문제를 내 말로 다시 묻고, 맞는 답을 적어 두세요. 연습할 때는 문제만 먼저 보여요."}</p>
      <label class="field">문제 (앞면)<textarea id="c-front" rows="3" placeholder="예: 딕과 케리 모형의 한계를 RPISD가 어떻게 보완하는지 설명하시오.">${esc(v.front)}</textarea></label>
      <label class="field" style="margin-top:10px">답안 (뒷면)<textarea id="c-back" rows="6" placeholder="맞는 답, 꼭 넣을 키워드, 내가 틀렸던 부분을 적어요.">${esc(v.back)}</textarea></label>
      <details style="margin-top:8px"><summary>더 넣기 (축, 변형 문제, 처음 볼 날)</summary>
        <div class="grid" style="margin-top:8px"><label class="field">축<select id="c-axis">${axisOpts(v.axis)}</select></label><label class="field">처음 볼 날<input type="date" id="c-due" value="${esc(v.due || t)}"></label></div>
        <label class="field" style="margin-top:8px">변형 문제 (선택, 답을 본 뒤 한 번 더 생각할 질문)<input id="c-var" value="${esc(v.variant)}"></label></details>
      <div class="row"><button class="btn go" data-act="save-card">${ec ? "수정 저장" : "카드 저장"}</button>${ec || ui.cardDraft ? `<button class="btn ghost" data-act="cancel-card">취소</button>` : ""}
        ${ui.madeCount ? `<span class="muted">방금 ${ui.madeCount}장 만들었어요</span><button class="link" data-act="prq-start" data-v="due">바로 연습하기</button>` : ""}</div>`;
  } else if (mode === "list"){
    const all = [...S.cards].sort((x, y) => (x.due || "").localeCompare(y.due || ""));
    h += all.length ? all.map(x => `<div class="entry"><div class="tline"><span class="kind">${esc(x.axis)}</span><span class="muted">다음 ${x.due ? md(x.due) : "-"}</span></div><div>${esc(x.front)}</div>
      <div class="tacts"><button class="link" data-act="edit-card" data-id="${x.id}">수정</button><button class="link danger" data-act="del-card" data-id="${x.id}">삭제</button></div></div>`).join("")
      : `<p class="empty">아직 카드가 없어요. '만들기'에서 추가하세요.</p>`;
  } else {
    const q = ui.prq, cards = prqCards();
    if (!q || q.i >= cards.length){
      if (q && cards.length) h += `<p class="hint">${cards.length}장을 모두 봤어요.</p>`;
      h += `<div class="row"><button class="btn go" data-act="prq-start" data-v="due" ${due.length ? "" : "disabled"}>오늘 볼 카드 ${due.length}장 연습</button>
        <button class="btn ghost" data-act="prq-start" data-v="all" ${S.cards.length ? "" : "disabled"}>전체 섞어서 연습</button></div>
        ${!S.cards.length ? `<p class="empty">카드가 없어요. '만들기'에서 틀린 문제를 카드로 만들어 보세요.</p>` : ""}`;
    } else {
      const c = cards[q.i];
      h += `<div class="flash"><div class="tline"><span class="kind">${esc(c.axis)}</span><span class="muted">${q.i + 1} / ${cards.length}</span></div>
        <p class="front">${esc(c.front)}</p>
        ${q.revealed ? `
          <div class="grid" style="margin-top:12px">
            ${q.attempt ? `<div><div class="lab">내가 먼저 쓴 답</div><div class="pre">${esc(q.attempt)}</div></div>` : ""}
            <div><div class="lab">답안</div><div class="back" style="margin-top:4px;padding-top:0;border-top:0">${esc(c.back || "(답안이 비어 있어요. 수정에서 적어 두세요)")}</div></div></div>
          ${c.variant ? `<p class="variant" style="margin-top:10px">한 번 더: ${esc(c.variant)}</p>` : ""}
          <div class="lab" style="margin-top:12px">얼마나 답할 수 있었나요?</div>
          <div class="row"><button class="btn sm ghost" data-act="prq-grade" data-g="again">틀림 (내일 다시)</button>
            <button class="btn sm ghost" data-act="prq-grade" data-g="hard">애매 (3일 뒤)</button>
            <button class="btn sm go" data-act="prq-grade" data-g="good">맞음</button>
            <button class="link" data-act="edit-card" data-id="${c.id}" style="margin-left:auto">카드 수정</button></div>`
        : `<label class="field" style="margin-top:10px">먼저 생각해 보세요 (적어 두면 답안과 나란히 비교돼요)<textarea id="prq-attempt" rows="4">${esc(q.attempt || "")}</textarea></label>
          <div class="row"><button class="btn go" data-act="prq-reveal">답안 보기</button><button class="btn sm ghost" data-act="prq-skip">건너뛰기</button></div>`}
      </div>`;
    }
  }
  return h + `</section>`;
}
function viewReview(){
  const t = todayStr();
  let h = viewCards();
  // 축 현황판
  h += `<section class="panel"><div class="ph"><h2>축별 현황</h2><span class="muted">지금 혼자 어디까지 쓸 수 있는지 골라 주세요</span></div><div class="tablewrap"><table class="axes"><thead><tr><th>축</th><th>지금 단계</th><th>답안</th><th>기록상 최고</th></tr></thead><tbody>`;
  for (const ax of AXES){
    const st = S.axis_status.find(s => s.axis === ax), lv = st ? st.level : 0;
    const as = S.answers.filter(a => a.axis === ax), best = as.length ? Math.max(...as.map(a => a.level ?? 0)) : null;
    h += `<tr><td>${esc(ax)}</td><td><select data-act="axis-level" data-axis="${esc(ax)}" aria-label="${esc(ax)} 단계">${LEVELS.map((l, i) => `<option value="${i}" ${lv === i ? "selected" : ""}>${l}</option>`).join("")}</select></td>
      <td>${as.length}편</td><td>${best == null ? `<span class="muted">없음</span>` : `<span class="lv lv${best}">${LEVELS[best]}</span>`}</td></tr>`;
  }
  h += `</tbody></table></div></section>`;

  // 요약 노트
  h += `<section class="panel"><div class="ph"><h2>요약 노트</h2><span class="muted">공부한 날마다 5분, 키워드 3~5개</span>
      <span class="seg" style="margin-left:auto"><button aria-pressed="${ui.notesView === "list"}" data-act="notes-view" data-v="list">날짜순</button><button aria-pressed="${ui.notesView === "sheet"}" data-act="notes-view" data-v="sheet">한 장 보기</button></span></div>`;
  if (ui.notesView === "sheet"){
    h += `<div class="sheet">${AXES.map(ax => { const ns = S.notes.filter(n => n.axis === ax); return `<h3>${esc(ax)}</h3>${ns.length ? `<ul class="plain">${ns.map(n => `<li>${esc(n.keywords)}${n.confusion ? ` <span class="muted">(헷갈림: ${esc(n.confusion)})</span>` : ""}</li>`).join("")}</ul>` : `<p class="empty">아직 없음</p>`}`; }).join("")}</div>`;
  } else {
    h += `<div class="grid"><label class="field">날짜<input type="date" id="n-date" value="${t}"></label><label class="field">축<select id="n-axis">${axisOpts(AXES[0])}</select></label></div>
      <div class="grid" style="grid-template-columns:1fr;margin-top:10px"><label class="field">답안에 꼭 쓸 키워드<input id="n-kw"></label><label class="field">헷갈린 점 (선택)<input id="n-conf"></label></div>
      <div class="row"><button class="btn sm" data-act="save-note">노트 저장</button></div>`;
    const ns = [...S.notes].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    if (ns.length) h += ns.map(n => `<div class="entry"><div class="tline"><span class="muted">${n.date ? md(n.date) : ""}</span><span class="kind">${esc(n.axis)}</span></div><div>${esc(n.keywords)}</div>${n.confusion ? `<div class="muted">헷갈림: ${esc(n.confusion)}</div>` : ""}<div class="tacts"><button class="link danger" data-act="del-note" data-id="${n.id}">삭제</button></div></div>`).join("");
  }
  return h + `</section>`;
}

/* ---------- 면접 ---------- */
function viewIv(){
  let h = docButtons(["sop", "report", "en"]) + `<div class="row" style="margin:0 0 14px"><span class="seg"><button aria-pressed="${ui.ivMode === "practice"}" data-act="iv-mode" data-v="practice">즉답 연습</button><button aria-pressed="${ui.ivMode === "cards"}" data-act="iv-mode" data-v="cards">근거 카드</button></span></div>`;
  return h + (ui.ivMode === "cards" ? viewIvCards() : viewPractice());
}

function viewPractice(){
  const p = ui.pr;
  if (!p){
    const logs = [...S.practice_logs].filter(l => l.stuck).sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")).slice(0, 15);
    return `<section class="panel"><div class="ph"><h2>즉답 연습</h2><span class="muted">내 연습 기준: 질문마다 ${CONFIG.PREP_SEC}초 준비, ${CONFIG.SPEAK_SEC}초 답변, 이어서 꼬리질문</span></div>
      <div class="grid"><label class="field">언어<select id="pr-lang"><option value="en">영어</option><option value="ko">한국어</option><option value="mix">섞기</option></select></label>
        <label class="field">질문 수<select id="pr-n"><option>1</option><option selected>2</option><option>3</option></select></label>
        <label class="field">녹음<select id="pr-rec"><option value="0">안 함</option><option value="1">이 기기에서만 녹음해 다시 듣기</option></select></label></div>
      <p class="hint">연습 횟수가 적은 질문부터 나와요. 녹음은 어디에도 올라가지 않고 이 화면을 벗어나면 사라져요.</p>
      <div class="row"><button class="btn go" data-act="pr-start">연습 시작</button></div></section>
      <section class="panel"><div class="ph"><h2>막힌 표현 모음</h2></div>${logs.length ? `<ul class="plain">${logs.map(l => { const q = find("interview", l.interview_id); return `<li>${esc(l.stuck)} <span class="muted">${q ? esc(q.question) : ""}</span></li>`; }).join("")}</ul>` : `<p class="empty">연습 후 막힌 표현을 남기면 여기에 모여요.</p>`}</section>`;
  }
  const q = find("interview", p.queue[p.i]);
  if (p.phase === "done") return `<section class="panel stage"><p class="phase">연습 끝</p><p class="q">${p.queue.length}개 질문을 마쳤어요.</p><div class="row" style="justify-content:center"><button class="btn go" data-act="pr-start-again">한 번 더</button><button class="btn ghost" data-act="pr-stop">닫기</button></div></section>`;
  if (!q){ ui.pr = null; return viewPractice(); }
  const head = `<p class="phase">${p.i + 1} / ${p.queue.length}${p.recording ? ` <span class="rec-dot"></span>녹음 중` : ""}</p>`;
  if (p.phase === "log"){
    return `<section class="panel stage">${head}<p class="q">${esc(q.question)}</p>
      ${p.audioUrl ? `<audio controls src="${p.audioUrl}" style="width:100%;max-width:420px;margin:8px auto"></audio>` : ""}
      <div class="kw">${lines(q.keywords).map(k => `<span>${esc(k)}</span>`).join("")}</div>
      <div style="max-width:460px;margin:16px auto 0;text-align:left">
        <div class="checks"><label><input type="checkbox" id="pl-content">핵심 내용을 말했다</label><label><input type="checkbox" id="pl-time">1분 안에 마쳤다</label></div>
        <label class="field" style="margin-top:10px">막힌 표현 (선택)<input id="pl-stuck" placeholder="예: 정보량과 읽기 부담을 구분하지 않는다"></label>
        <div class="row"><button class="btn go" data-act="pr-save-log">기록하고 ${p.i + 1 < p.queue.length ? "다음 질문" : "마치기"}</button><button class="btn ghost" data-act="pr-skip-log">기록 없이 넘어가기</button></div></div></section>`;
  }
  const phaseName = {prep: "준비", speak: "답변", follow: "꼬리질문 답변"}[p.phase];
  const text = p.phase === "follow" ? q.followup : q.question;
  return `<section class="panel stage ${p.phase}">${head}<p class="phase">${phaseName}</p><p class="q">${esc(text)}</p>
    <div class="big" id="pr-clock">${clock(p.left)}</div>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-act="pr-next">${p.phase === "prep" ? "바로 답변 시작" : "답변 끝"}</button><button class="btn ghost" data-act="pr-stop">그만하기</button></div></section>`;
}

  const e = ui.editIv ? find("interview", ui.editIv) : null;
  const v = e || {lang: "ko", topic: "", question: "", keywords: "", evidence: "", limits: "", followup: ""};
  let list = S.interview.filter(q => ui.ivFilter === "all" || q.lang === ui.ivFilter);
  let h = `<section class="panel"><div class="ph"><h2>${e ? "근거 카드 수정" : "근거 카드 추가"}</h2><span class="muted">예상 질문, 1분 답변 키워드, 근거 자료, 한계</span></div>
    <div class="grid"><label class="field">언어<select id="iv-lang"><option value="ko" ${v.lang === "ko" ? "selected" : ""}>한국어</option><option value="en" ${v.lang === "en" ? "selected" : ""}>영어</option></select></label>
      <label class="field">주제<input id="iv-topic" value="${esc(v.topic)}" placeholder="실행연구, 연구계획, 이론…"></label></div>
    <div class="grid" style="grid-template-columns:1fr;margin-top:10px">
      <label class="field">예상 질문<input id="iv-q" value="${esc(v.question)}"></label>
      <label class="field">답변 키워드 (줄마다 하나, 세 개 정도)<textarea id="iv-kw" rows="3">${esc(v.keywords)}</textarea></label>
      <label class="field">근거 자료<input id="iv-ev" value="${esc(v.evidence)}"></label>
      <label class="field">한계·함께 말할 것<input id="iv-lim" value="${esc(v.limits)}"></label>
      <label class="field">꼬리질문<input id="iv-fu" value="${esc(v.followup)}"></label></div>

  h += `<section class="panel"><div class="ph"><h2>카드 ${list.length}장</h2><span class="seg" style="margin-left:auto">${[["all","전체"],["ko","한국어"],["en","영어"]].map(([k, l]) => `<button aria-pressed="${ui.ivFilter === k}" data-act="iv-filter" data-v="${k}">${l}</button>`).join("")}</span></div>`;

  h += list.map(q => `<details class="entry"><summary><span class="kind ${q.lang === "en" ? "k-en" : "k-iv"}">${q.lang === "en" ? "영어" : "한국어"}</span>${q.topic ? `<span class="muted">${esc(q.topic)}</span>` : ""}<span>${esc(q.question)}</span><span class="muted">연습 ${q.practice_count || 0}회</span></summary>
    <div class="body">${lines(q.keywords).length ? `<div class="lab">키워드</div><ul class="plain">${lines(q.keywords).map(k => `<li>${esc(k)}</li>`).join("")}</ul>` : ""}
      ${q.evidence ? `<div class="lab">근거</div><div>${esc(q.evidence)}</div>` : ""}
      ${q.limits ? `<div class="lab">한계·함께 말할 것</div><div>${esc(q.limits)}</div>` : ""}
      ${q.followup ? `<div class="lab">꼬리질문</div><div>${esc(q.followup)}</div>` : ""}
      <div class="tacts" style="margin-top:8px"><button class="link" data-act="edit-iv" data-id="${q.id}">수정</button><button class="link danger" data-act="del-iv" data-id="${q.id}">삭제</button></div></div></details>`).join("");
  return h + `</section>`;
}

/* =========================================================
   5. 면접 연습 진행
   ========================================================= */
function stopTimers(){ if (ui.pr && ui.pr.tid){ clearInterval(ui.pr.tid); ui.pr.tid = null; } }
function startPractice(lang, n, rec){
  let pool = S.interview.filter(q => lang === "mix" || q.lang === lang);
  if (!pool.length){ toast("연습할 질문 카드가 없어요. 근거 카드에서 먼저 추가하세요."); return; }
  pool = shuffle(pool).sort((a, b) => (a.practice_count || 0) - (b.practice_count || 0)).slice(0, n);
  ui.pr = {queue: pool.map(q => q.id), i: 0, phase: "prep", left: CONFIG.PREP_SEC, rec, lang, n, tid: null};
  startPhase("prep");
}
function startPhase(ph){
  const p = ui.pr; if (!p) return;
  stopTimers(); p.phase = ph;
  if (ph === "prep") { p.left = CONFIG.PREP_SEC; if (p.audioUrl){ URL.revokeObjectURL(p.audioUrl); p.audioUrl = null; } }
  if (ph === "speak" || ph === "follow") p.left = CONFIG.SPEAK_SEC;
  if (ph === "speak" && p.rec) startRec();
  if (ph === "log" || ph === "done") stopRec();
  render();
  if (["prep", "speak", "follow"].includes(ph)) p.tid = setInterval(tick, 1000);
}
function tick(){
  const p = ui.pr; if (!p) return;
  p.left--;
  const el = document.getElementById("pr-clock"); if (el) el.textContent = clock(p.left);
  if (p.left <= 0){ stopTimers(); beep(); nextPhase(); }
}
function nextPhase(){
  const p = ui.pr; if (!p) return;
  const q = find("interview", p.queue[p.i]);
  if (p.phase === "prep") startPhase("speak");
  else if (p.phase === "speak") startPhase(q && q.followup ? "follow" : "log");
  else if (p.phase === "follow") startPhase("log");
}
function nextQuestion(){ const p = ui.pr; p.i++; if (p.i < p.queue.length) startPhase("prep"); else startPhase("done"); }
async function startRec(){
  const p = ui.pr;
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast("이 브라우저에서는 녹음을 쓸 수 없어요"); p.rec = false; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    if (ui.pr !== p || !["speak", "follow"].includes(p.phase)){ stream.getTracks().forEach(t => t.stop()); return; }
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); if (ui.pr === p){ p.audioUrl = URL.createObjectURL(new Blob(chunks, {type: mr.mimeType})); p.recording = false; if (p.phase === "log") render(); } };
    mr.start(); p.mr = mr; p.recording = true;
    const head = document.querySelector(".stage .phase"); if (head && !head.querySelector(".rec-dot")) head.insertAdjacentHTML("beforeend", ` <span class="rec-dot"></span>녹음 중`);
  } catch(e){ toast("마이크를 쓸 수 없어서 녹음 없이 진행해요"); p.rec = false; }
}
function stopRec(){ const p = ui.pr; if (p && p.mr && p.mr.state !== "inactive"){ p.mr.stop(); } if (p) p.mr = null; }
function endPractice(){ stopTimers(); stopRec(); if (ui.pr && ui.pr.audioUrl) URL.revokeObjectURL(ui.pr.audioUrl); ui.pr = null; }

      : {axis: AXES[4], front: `'${concept}'을(를) 다음 문제의 답안 어디에, 어떻게 쓸 수 있는지 설명하시오.\n${qtext}`, back: "", variant: "", due: todayStr()};
    ui.editCard = null; ui.cardMode = "make"; ui.tab = "review"; render(); window.scrollTo(0, 0); toast("내용을 채워 두었어요. 고쳐서 저장하세요");
  },
  async "cancel-card"(){ ui.editCard = null; ui.cardDraft = null; render(); },
  async "del-card"(b, id){ if (!confirm("이 카드를 삭제할까요?")) return; await rm("cards", id); render(); },
  async "notes-view"(b){ ui.notesView = b.dataset.v; render(); },
  async "save-note"(){ const kw = val("n-kw"); if (!kw) return toast("키워드를 적어 주세요"); await ins("notes", {date: val("n-date") || todayStr(), axis: val("n-axis"), keywords: kw, confusion: val("n-conf")}); render(); toast("노트를 저장했어요"); },
  async "del-note"(b, id){ if (!confirm("이 노트를 삭제할까요?")) return; await rm("notes", id); render(); },
  // 면접
  async "iv-mode"(b){ endPractice(); ui.ivMode = b.dataset.v; render(); },
  async "iv-filter"(b){ ui.ivFilter = b.dataset.v; render(); },
  async "save-iv"(){
    const q = val("iv-q"); if (!q) return toast("예상 질문을 적어 주세요");
    const row = {lang: val("iv-lang"), topic: val("iv-topic"), question: q, keywords: document.getElementById("iv-kw").value.trim(), evidence: val("iv-ev"), limits: val("iv-lim"), followup: val("iv-fu")};
    if (ui.editIv){ await upd("interview", ui.editIv, row); ui.editIv = null; toast("수정했어요"); }
    else { await ins("interview", {...row, practice_count: 0}); toast("카드를 저장했어요"); }
    render();
  },
  async "edit-iv"(b, id){ ui.editIv = id; render(); window.scrollTo(0, 0); },
  async "cancel-iv"(){ ui.editIv = null; render(); },
  async "del-iv"(b, id){ if (!confirm("이 카드를 삭제할까요?")) return; await rm("interview", id); render(); },
  async "pr-start"(){ startPractice(val("pr-lang"), +val("pr-n") || 2, val("pr-rec") === "1"); },
  async "pr-start-again"(){ const p = ui.pr; endPractice(); startPractice(p ? p.lang : "en", p ? p.n : 2, p ? p.rec : false); },
  async "pr-next"(){ stopTimers(); nextPhase(); },
  async "pr-stop"(){ endPractice(); render(); },
  async "pr-skip-log"(){ nextQuestion(); },
  async "pr-save-log"(){
    const p = ui.pr, q = find("interview", p.queue[p.i]);
    await ins("practice_logs", {interview_id: q.id, date: todayStr(), said_content: document.getElementById("pl-content").checked, in_time: document.getElementById("pl-time").checked, stuck: val("pl-stuck")});
    await upd("interview", q.id, {practice_count: (q.practice_count || 0) + 1});
    nextQuestion();
  },
  // 계정
  async "sign-in"(b){
    const email = val("email"), password = document.getElementById("password").value;
    if (!email || !password) return toast("이메일과 비밀번호를 모두 적어 주세요");
    b.disabled = true;
    const {error} = await sb.auth.signInWithPassword({email, password});
    b.disabled = false;
    if (error) return toast(error.message.includes("Invalid") ? "이메일 또는 비밀번호가 맞지 않아요" : "로그인하지 못했어요: " + error.message);
  },
  async "logout"(){ if (!confirm("로그아웃할까요?")) return; await sb.auth.signOut(); }
};

const changes = {
  async "toggle-task"(el){ await upd("tasks", el.dataset.id, {done: el.checked}); render(); },
  async "set-date"(el){ await upd("tasks", el.dataset.id, {date: el.value || null}); render(); toast(el.value ? `${md(el.value)}로 옮겼어요` : "미배치 과제함으로 옮겼어요"); },
  async "axis-level"(el){
    const ax = el.dataset.axis, level = +el.value, st = S.axis_status.find(s => s.axis === ax);
    if (st) await upd("axis_status", st.id, {level}); else await ins("axis_status", {axis: ax, level});
    render();
  }
};

async function moveSpare(id, dir){
  const all = spareList(), i = all.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= all.length) return;
  const a = all[i], c = all[j], sa = a.sort ?? i, sc = c.sort ?? j;
  await upd("tasks", a.id, {sort: sc === sa ? j : sc}); await upd("tasks", c.id, {sort: sc === sa ? i : sa}); render();
}
async function guard(fn){
  try { await fn(); }
  catch(e){ console.error(e); toast("저장하지 못했어요: " + (e.message || e)); render(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const f = actions[b.dataset.act]; if (f) guard(() => f(b, b.dataset.id));
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "BUTTON") return;
  const f = changes[el.dataset.act]; if (f) guard(() => f(el));
});
document.addEventListener("input", e => {
  if (e.target.id !== "dq-answer") return;
  const d = DQ(); d.answer = e.target.value;
  const c = document.getElementById("dq-count"); if (c) c.textContent = d.answer.length + "자";
  clearTimeout(d.saveT);
  d.saveT = setTimeout(async () => {
    if (!d.q) return;
    const {error} = await sb.from("exam_questions").update({draft: d.answer}).eq("id", d.q.id);
    const now = new Date(); d.saving = error ? "임시 저장 실패" : `임시 저장 ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const el = document.getElementById("dq-save"); if (el) el.textContent = d.saving;
  }, 1500);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  const el = e.target;
  if (el.id === "password" || el.id === "email"){ const b = document.querySelector('button[data-act="sign-in"]'); if (b) b.click(); return; } if (!el.id || !el.id.startsWith("nt-title-")) return;
  const b = el.parentElement.querySelector('button[data-act="add-task"]'); if (b) b.click();
});

/* =========================================================
   7. 시작
   ========================================================= */
async function start(){
  if (ui.starting || ui.ready) return;
  ui.starting = true; ui.needLogin = false;
  if (sb) db = new SupaDB(sb);
  app.innerHTML = `<p class="loading">기록을 불러오는 중…</p>`;
  try {
    const res = await Promise.all(TABLES.map(t => db.list(t)));
    TABLES.forEach((t, i) => S[t] = res[i] || []);
    ui.ready = true; render();
  } catch(e){
    console.error(e);
    app.innerHTML = `<p class="fatal">기록을 불러오지 못했어요: ${esc(e.message || e)}<br>Supabase에서 supabase_setup.sql을 실행했는지 확인해 주세요.</p>`;
  }
  ui.starting = false;
}
async function boot(){
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    if (!window.supabase){ app.innerHTML = `<p class="fatal">Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>`; return; }
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((ev, session) => {
      if (session && !ui.ready) setTimeout(start, 0);
      if (ev === "SIGNED_OUT"){ ui.ready = false; ui.needLogin = true; ui.daily = null; ui.uploads = undefined; TABLES.forEach(t => S[t] = []); render(); }
    });
    const {data: {session}} = await sb.auth.getSession();
    if (session) await start(); else if (!ui.ready && !ui.starting){ ui.needLogin = true; render(); }
  } else {
    db = new LocalDB(); await start();
  }
}
boot();
